name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.6.0

      - name: Compute CalVer version
        id: version
        run: |
          base=$(date -u +%Y.%-m.%-d)
          version=$base
          suffix=2
          while git rev-parse --quiet --verify "refs/tags/v${version}" >/dev/null; do
            version="${base}-${suffix}"
            suffix=$((suffix + 1))
          done
          previous_tag=$(git tag --list 'v[0-9][0-9][0-9][0-9].*' --sort=-v:refname | head -n 1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build package
        env:
          NODE_ENV: production
        run: pnpm run build

      - name: Pack tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pack
          mv "lensdiff-${VERSION}.tgz" lensdiff.tgz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          if [[ -n "$PREVIOUS_TAG" ]]; then
            notes_args=(--generate-notes --notes-start-tag "$PREVIOUS_TAG")
          else
            notes_args=(--notes "First CalVer release of lensdiff.")
          fi
          gh release create "$TAG" lensdiff.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --latest \
            "${notes_args[@]}"
